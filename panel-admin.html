<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin · Mestizo Café</title>
<style>
:root{--bg:#12314D;--bg2:#163B5C;--card:#1C4A70;--ink:#F4EFE3;--ink-dim:#9FBFDB;--accent:#2FA9DC;--accent-ink:#0B2438;--line:#28527A;--radius:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);padding:14px 16px}
h1{margin:0 0 10px;font-size:1.25rem;font-family:Georgia,serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.sub{display:flex;gap:6px;flex-wrap:wrap}
.sub button{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:7px 13px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:.85rem}
.sub button.active{background:var(--card);color:var(--ink);border-color:var(--accent)}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:11px 16px;font-family:inherit;font-size:1rem;cursor:pointer;font-weight:bold}
button.danger{background:#8C4040;color:#F4EFE3;border:none;border-radius:8px;padding:9px 14px;font-family:inherit;cursor:pointer}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-family:inherit;cursor:pointer}
input,textarea{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;width:100%;font-family:inherit}
label{font-size:.78rem;color:var(--ink-dim);display:block;margin-bottom:4px}
.row{display:flex;gap:10px}
.row>div{flex:1}
.orderline{display:flex;justify-content:space-between;padding:5px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem}
.pill.pendiente_pago{background:#5A4331}
.pill.aprobado{background:#3E5A31}
.pill.listo{background:var(--accent);color:var(--accent-ink)}
.pill.entregado{background:var(--line);color:var(--ink-dim)}
.pill.cancelacion_solicitada{background:#8C6A2A}
.pill.cancelado{background:#8C4040}
.stats-row{display:flex;gap:12px}
.stats-row .card{flex:1;text-align:center}
.stat .n{font-size:1.5rem;color:var(--accent);font-weight:bold}
.stat .l{font-size:.72rem;color:var(--ink-dim)}
.empty{color:var(--ink-dim);text-align:center;padding:24px 0}
.small{font-size:.8rem;color:var(--ink-dim)}
#app{position:relative;z-index:1}
.watermark{position:fixed;inset:0;background-repeat:no-repeat;background-position:center;background-size:65vmin;opacity:.06;pointer-events:none;z-index:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.chips button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:6px 12px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:.8rem;white-space:nowrap}
.chips button.active{background:var(--card);color:var(--ink);border-color:var(--accent)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:340px;width:100%;text-align:center}
.login-card img{height:64px;margin-bottom:10px}
.error-msg{color:#E88;font-size:.85rem;margin-top:8px}
.role-badge{font-size:.72rem;color:var(--ink-dim);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px 10px}
</style>
</head>

<div id="app" style="padding:40px;text-align:center;color:#C9B69C">Cargando…</div>
<script>
document.getElementById('watermark').style.backgroundImage = `url("${LOGO_DATAURI}")`;
let products=[], orders=[], cart={}, clientLabel='', tab='pend';
let busquedaReg='', catSelReg='Todas';
let role = localStorage.getItem('mestizo_role') || null;
let loginError='';
let cancelandoId=null, cancelMotivo='';
let historialFecha = new Date().toISOString().slice(0,10);

function login(){
  const pass = document.getElementById('loginPass').value;
  if(pass===ADMIN_TOKEN){ role='admin'; }
  else if(pass===USER_TOKEN){ role='user'; }
  else { loginError='Contraseña incorrecta.'; render(); return; }
  localStorage.setItem('mestizo_role', role);
  loginError='';
  tab='pend';
  init();
}
function logout(){
  role=null; localStorage.removeItem('mestizo_role'); render();
}

async function init(){
  document.getElementById('app').innerHTML = '<p style="padding:40px;text-align:center;color:#9FBFDB">Cargando…</p>';
  await loadAll();
}
async function loadAll(){
  const [pr, pe] = await Promise.all([
    fetch(`${API_URL}?action=productos`).then(r=>r.json()),
    fetch(`${API_URL}?action=pedidos`).then(r=>r.json())
  ]);
  products = pr; orders = pe.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  render();
}
async function post(action,payload){
  await fetch(`${API_URL}?action=${action}&payload=${encodeURIComponent(JSON.stringify({...payload, token: role==='admin'?ADMIN_TOKEN:USER_TOKEN}))}`);
  await loadAll();
}
function fmt(n){ return '$'+Number(n).toFixed(0); }
function todayStr(d){ return new Date(d).toDateString(); }
function setTab(t){ tab=t; render(); }
function addQty(id,delta){ const p=products.find(x=>x.id===id); if(!p) return; const next=(cart[id]||0)+delta; if(next<0||next>p.stock) return; cart[id]=next; if(!cart[id]) delete cart[id]; render(); }
function cartItems(){ return Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id===id);return{id,nombre:p.nombre,precio:p.precio,cantidad:q};}); }
function cartTotal(){ return cartItems().reduce((s,i)=>s+i.precio*i.cantidad,0); }

async function registrarPedidoManual(metodo){
  const items=cartItems(); if(items.length===0) return;
  await fetch(`${API_URL}?action=crearPedido&payload=${encodeURIComponent(JSON.stringify({items, total:cartTotal(), cliente:clientLabel, metodo}))}`);
  await loadAll();
  const last = orders[0];
  if(last) await post('aprobarPedido', {id:last.id});
  cart={}; clientLabel=''; render();
}
async function aprobar(id){ await post('aprobarPedido', {id}); }
async function marcar(id, estado){ await post('actualizarEstado', {id, estado}); }

function abrirCancelacion(id){ cancelandoId=id; cancelMotivo=''; render(); }
function cerrarCancelacion(){ cancelandoId=null; render(); }
async function confirmarSolicitudCancelacion(id){
  if(!cancelMotivo.trim()){ alert('Escribe el motivo de la cancelación.'); return; }
  await post('solicitarCancelacion', {id, motivo:cancelMotivo});
  cancelandoId=null; render();
}
async function cancelarDirecto(id){
  if(!cancelMotivo.trim()){ alert('Escribe el motivo de la cancelación.'); return; }
  await post('cancelarPedido', {id, motivo:cancelMotivo});
  cancelandoId=null; render();
}
async function resolverCancelacion(id, aprobar){
  await post('resolverCancelacion', {id, aprobar});
}

async function agregarProducto(){
  const nombre=document.getElementById('np-nombre').value.trim();
  const precio=Number(document.getElementById('np-precio').value)||0;
  const stock=Number(document.getElementById('np-stock').value)||0;
  const categoria=document.getElementById('np-cat').value.trim()||'Otros';
  if(!nombre) return;
  await post('agregarProducto', {nombre,precio,stock,categoria});
}
async function guardarProducto(id){
  const precio=Number(document.getElementById('p-precio-'+id).value)||0;
  const stock=Number(document.getElementById('p-stock-'+id).value)||0;
  await post('actualizarStock', {id, precio, stock});
}

function botonesCancelacion(o){
  if(o.estado==='cancelado' || o.estado==='cancelacion_solicitada') return '';
  if(cancelandoId===o.id){
    const accion = role==='admin' ? `cancelarDirecto('${o.id}')` : `confirmarSolicitudCancelacion('${o.id}')`;
    return `<div style="margin-top:8px">
      <label>Motivo de la cancelación</label>
      <textarea rows="2" oninput="cancelMotivo=this.value">${cancelMotivo}</textarea>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="danger" style="flex:1" onclick="${accion}">${role==='admin'?'Cancelar pedido':'Enviar solicitud'}</button>
        <button class="secondary" style="flex:1" onclick="cerrarCancelacion()">Cerrar</button>
      </div></div>`;
  }
  return `<button class="secondary" style="margin-top:8px" onclick="abrirCancelacion('${o.id}')">🚫 ${role==='admin'?'Cancelar pedido':'Solicitar cancelación'}</button>`;
}

function renderPendientes(){
  const pend = orders.filter(o=>o.estado==='pendiente_pago');
  if(pend.length===0) return '<p class="empty">No hay pedidos esperando validación de pago.</p>';
  return pend.map(o=>`<div class="card">
    <div class="orderline"><strong>#${o.num} · ${o.cliente||''}</strong><span class="pill ${o.estado}">${o.metodo==='efectivo'?'💵 Efectivo':o.metodo==='tarjeta'?'💳 Tarjeta':'pendiente'}</span></div>
    ${o.items.map(i=>`<div class="orderline small"><span>${i.cantidad}x ${i.nombre}</span><span>${fmt(i.precio*i.cantidad)}</span></div>`).join('')}
    <div class="orderline" style="font-weight:bold"><span>Total</span><span>${fmt(o.total)}</span></div>
    <button class="primary" style="margin-top:8px" onclick="aprobar('${o.id}')">✅ Validé el pago, aprobar</button>
    ${botonesCancelacion(o)}
  </div>`).join('');
}
function renderHoy(){
  const today=new Date().toDateString();
  const estadosVisibles = ['aprobado','listo','entregado','cancelacion_solicitada','cancelado'];
  const list = orders.filter(o=>estadosVisibles.includes(o.estado) && todayStr(o.fecha)===today);
  if(list.length===0) return '<p class="empty">Sin pedidos aprobados hoy todavía.</p>';
  const etiquetas = {aprobado:'aprobado',listo:'listo',entregado:'entregado',cancelacion_solicitada:'cancelación solicitada',cancelado:'cancelado'};
  return list.map(o=>`<div class="card">
    <div class="orderline"><strong>#${o.num} · ${o.cliente||''}</strong><span class="pill ${o.estado}">${etiquetas[o.estado]}</span></div>
    ${o.items.map(i=>`<div class="orderline small"><span>${i.cantidad}x ${i.nombre}</span><span>${fmt(i.precio*i.cantidad)}</span></div>`).join('')}
    <div class="orderline" style="font-weight:bold"><span>Total</span><span>${fmt(o.total)}</span></div>
    ${o.estado==='cancelacion_solicitada'?`<div class="card small" style="background:var(--bg2);margin-top:8px">⏳ Esperando que el administrador apruebe la cancelación.${o.motivoCancelacion?' Motivo: '+o.motivoCancelacion:''}</div>`:''}
    ${o.estado==='cancelado'&&o.motivoCancelacion?`<div class="card small" style="background:var(--bg2);margin-top:8px">Motivo de cancelación: ${o.motivoCancelacion}</div>`:''}
    <div style="margin-top:8px;display:flex;gap:8px">
      ${o.estado==='aprobado'?`<button class="primary" onclick="marcar('${o.id}','listo')">🔔 Marcar listo</button>`:''}
      ${o.estado==='listo'?`<button class="primary" onclick="marcar('${o.id}','entregado')">📣 Entregado</button>`:''}
    </div>
    ${botonesCancelacion(o)}
    </div>`).join('');
}
function renderCancelaciones(){
  const list = orders.filter(o=>o.estado==='cancelacion_solicitada');
  if(list.length===0) return '<p class="empty">No hay solicitudes de cancelación pendientes.</p>';
  return list.map(o=>`<div class="card">
    <div class="orderline"><strong>#${o.num} · ${o.cliente||''}</strong><span class="pill cancelacion_solicitada">solicitada</span></div>
    ${o.items.map(i=>`<div class="orderline small"><span>${i.cantidad}x ${i.nombre}</span><span>${fmt(i.precio*i.cantidad)}</span></div>`).join('')}
    <div class="orderline" style="font-weight:bold"><span>Total</span><span>${fmt(o.total)}</span></div>
    <div class="card small" style="background:var(--bg2);margin-top:8px"><strong>Motivo:</strong> ${o.motivoCancelacion||'(sin especificar)'}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="danger" style="flex:1" onclick="resolverCancelacion('${o.id}',true)">✅ Aprobar cancelación</button>
      <button class="secondary" style="flex:1" onclick="resolverCancelacion('${o.id}',false)">Rechazar</button>
    </div></div>`).join('');
}
function renderHistorial(){
  const list = orders.filter(o=>new Date(o.fecha).toISOString().slice(0,10)===historialFecha);
  const total = list.filter(o=>['aprobado','listo','entregado'].includes(o.estado)).reduce((s,o)=>s+o.total,0);
  const cancelados = list.filter(o=>o.estado==='cancelado').length;
  const picker = `<div class="card"><label>Selecciona una fecha</label>
    <input type="date" value="${historialFecha}" onchange="historialFecha=this.value;render()"></div>`;
  const resumen = `<div class="stats-row"><div class="card stat"><div class="n">${fmt(total)}</div><div class="l">Total ese día</div></div>
    <div class="card stat"><div class="n">${list.length}</div><div class="l">Pedidos (${cancelados} cancelados)</div></div></div>`;
  if(list.length===0) return picker + resumen + '<p class="empty">Sin pedidos en esa fecha.</p>';
  const detalle = list.map(o=>`<div class="card">
    <div class="orderline"><strong>#${o.num} · ${o.cliente||''}</strong><span class="pill ${o.estado}">${o.estado}</span></div>
    ${o.items.map(i=>`<div class="orderline small"><span>${i.cantidad}x ${i.nombre}</span><span>${fmt(i.precio*i.cantidad)}</span></div>`).join('')}
    <div class="orderline" style="font-weight:bold"><span>Total</span><span>${fmt(o.total)}</span></div>
    ${o.estado==='cancelado'&&o.motivoCancelacion?`<div class="small" style="margin-top:6px"><strong>Motivo cancelación:</strong> ${o.motivoCancelacion}</div>`:''}
  </div>`).join('');
  return picker + resumen + detalle;
}
function renderRegistrar(){
  const todasCats=[...new Set(products.map(p=>p.categoria))];
  const filtrados = products.filter(p=>
    (catSelReg==='Todas'||p.categoria===catSelReg) &&
    p.nombre.toLowerCase().includes(busquedaReg.toLowerCase())
  );
  const cats=[...new Set(filtrados.map(p=>p.categoria))];
  let html='';
  cats.forEach(cat=>{
    html+=`<h3 style="color:var(--accent);font-size:.95rem;margin:16px 0 4px">${cat}</h3>`;
    filtrados.filter(p=>p.categoria===cat).forEach(p=>{
      const qty=cart[p.id]||0, out=p.stock<=0;
      html+=`<div class="prod"><div><strong>${p.nombre}</strong><div class="small">${fmt(p.precio)} · stock ${p.stock}</div></div>
      <div class="qty"><button ${qty===0?'disabled style="opacity:.3"':''} onclick="addQty('${p.id}',-1)">–</button><span>${qty}</span>
      <button ${out||qty>=p.stock?'disabled style="opacity:.3"':''} onclick="addQty('${p.id}',1)">+</button></div></div>`;
    });
  });
  if(filtrados.length===0) html='<p class="small" style="text-align:center;padding:16px">Sin resultados para tu búsqueda.</p>';
  const buscador = `<input id="buscadorAdmin" placeholder="🔍 Buscar producto..." value="${busquedaReg}" oninput="busquedaReg=this.value;render()">
  <div class="chips" id="chipsReg">
    <button class="${catSelReg==='Todas'?'active':''}" onclick="catSelReg='Todas';render()">Todas</button>
    ${todasCats.map(c=>`<button class="${catSelReg===c?'active':''}" onclick="catSelReg='${c.replace(/'/g,"\\'")}';render()">${c}</button>`).join('')}
  </div>`;
  const items=cartItems();
  return `<p class="small">Cuando el cliente pague en efectivo o con terminal, registra aquí lo que llevó: descuenta el stock y queda en el reporte del día.</p>
  ${buscador}
  <div class="card">${html}</div>
  ${items.length?`<div class="card">${items.map(i=>`<div class="orderline"><span>${i.cantidad}x ${i.nombre}</span><span>${fmt(i.precio*i.cantidad)}</span></div>`).join('')}
    <div class="orderline" style="font-weight:bold;color:var(--accent)"><span>Total</span><span>${fmt(cartTotal())}</span></div>
    <div style="margin:10px 0"><label>Cliente/mesa</label><input value="${clientLabel}" oninput="clientLabel=this.value"></div>
    <div style="display:flex;gap:8px">
      <button class="primary" style="flex:1" onclick="registrarPedidoManual('efectivo')">💵 Efectivo</button>
      <button class="primary" style="flex:1" onclick="registrarPedidoManual('tarjeta')">💳 Tarjeta</button>
    </div></div>`:''}`;
}
function renderInventario(){
  return `<div class="card"><h3 style="margin-top:0">Agregar producto</h3>
    <div class="row"><div><label>Nombre</label><input id="np-nombre"></div><div><label>Categoría</label><input id="np-cat" placeholder="Café"></div></div>
    <div class="row" style="margin-top:8px"><div><label>Precio</label><input id="np-precio" type="number"></div><div><label>Stock</label><input id="np-stock" type="number"></div></div>
    <button class="primary" style="margin-top:10px" onclick="agregarProducto()">+ Agregar</button></div>
  ${products.map(p=>`<div class="card"><div class="orderline"><strong>${p.nombre}</strong><span class="small">${p.categoria||''}</span></div>
    <div class="row" style="margin-top:8px"><div><label>Precio</label><input id="p-precio-${p.id}" type="number" value="${p.precio}"></div>
    <div><label>Stock</label><input id="p-stock-${p.id}" type="number" value="${p.stock}"></div></div>
    <button class="secondary" style="margin-top:8px" onclick="guardarProducto('${p.id}')">Guardar</button></div>`).join('')}`;
}
function renderReporte(){
  const today=new Date().toDateString();
  const hoy=orders.filter(o=>['aprobado','listo','entregado'].includes(o.estado) && todayStr(o.fecha)===today);
  const total=hoy.reduce((s,o)=>s+o.total,0);
  const efectivo=hoy.filter(o=>o.metodo==='efectivo').reduce((s,o)=>s+o.total,0);
  const tarjeta=hoy.filter(o=>o.metodo==='tarjeta').reduce((s,o)=>s+o.total,0);
  const otro=total-efectivo-tarjeta;
  const cnt={}; hoy.forEach(o=>o.items.forEach(i=>{cnt[i.nombre]=(cnt[i.nombre]||0)+i.cantidad;}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="stats-row"><div class="card stat"><div class="n">${fmt(total)}</div><div class="l">Venta total hoy</div></div>
  <div class="card stat"><div class="n">${hoy.length}</div><div class="l">Pedidos hoy</div></div></div>
  <div class="stats-row"><div class="card stat"><div class="n">💵 ${fmt(efectivo)}</div><div class="l">Efectivo</div></div>
  <div class="card stat"><div class="n">💳 ${fmt(tarjeta)}</div><div class="l">Tarjeta</div></div></div>
  ${otro>0?`<div class="card small" style="text-align:center">Sin método registrado: ${fmt(otro)}</div>`:''}
  <div class="card"><p class="small" style="margin:0 0 4px">Producto más vendido hoy</p><p style="margin:0;font-weight:bold">${top?top[0]+' ('+top[1]+' uds)':'—'}</p></div>`;
}

function renderLogin(){
  return `<div class="login-wrap"><div class="login-card">
    <img src="${LOGO_DATAURI}" alt="Mestizo Café">
    <h2 style="margin:0 0 4px">Panel Admin</h2>
    <p class="small" style="margin:0 0 16px">Ingresa tu contraseña de acceso</p>
    <input type="password" id="loginPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()">
    <button class="primary" style="width:100%;margin-top:12px" onclick="login()">Entrar</button>
    ${loginError?`<p class="error-msg">${loginError}</p>`:''}
  </div></div>`;
}

function render(){
  if(!role){
    document.getElementById('app').innerHTML = renderLogin();
    document.getElementById('loginPass').focus();
    return;
  }
  const scrollY = window.scrollY;
  const chipsEl = document.getElementById('chipsReg');
  const chipsScroll = chipsEl ? chipsEl.scrollLeft : 0;
  const cancTab = orders.filter(o=>o.estado==='cancelacion_solicitada').length;
  const body = tab==='pend'?renderPendientes():tab==='hoy'?renderHoy():tab==='reg'?renderRegistrar():
               tab==='canc'?renderCancelaciones():tab==='hist'?renderHistorial():
               tab==='inv'?renderInventario():renderReporte();
  const tabsAdmin = role==='admin' ? `
    <button class="${tab==='canc'?'active':''}" onclick="setTab('canc')">Cancelaciones${cancTab>0?' ('+cancTab+')':''}</button>
    <button class="${tab==='hist'?'active':''}" onclick="setTab('hist')">Historial</button>
    <button class="${tab==='inv'?'active':''}" onclick="setTab('inv')">Inventario</button>
    <button class="${tab==='reporte'?'active':''}" onclick="setTab('reporte')">Reporte</button>` : '';
  document.getElementById('app').innerHTML = `<header style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
  <img src="${LOGO_DATAURI}" alt="Mestizo Café" style="height:36px;width:auto">
  <h1 style="margin:0;flex:1">Panel Admin · Mestizo Café</h1>
  <span class="role-badge">${role==='admin'?'👑 Administrador':'👤 Usuario'}</span>
  <button class="secondary" onclick="logout()">Salir</button>
  <div class="sub" style="width:100%">
    <button class="${tab==='pend'?'active':''}" onclick="setTab('pend')">Por aprobar</button>
    <button class="${tab==='hoy'?'active':''}" onclick="setTab('hoy')">Pedidos de hoy</button>
    <button class="${tab==='reg'?'active':''}" onclick="setTab('reg')">Registrar manual</button>
    ${tabsAdmin}
  </div></header><main>${body}</main>`;
  window.scrollTo(0, scrollY);
  const newChips = document.getElementById('chipsReg');
  if(newChips) newChips.scrollLeft = chipsScroll;
}

if(role) init(); else render();
</script>
</body>
</html>
